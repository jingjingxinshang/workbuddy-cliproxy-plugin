name: release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: so
          - goos: linux
            goarch: arm64
            ext: so
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Install cross compilers
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu
      - name: Build plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          if [ "$GOOS/$GOARCH" = "linux/arm64" ]; then export CC=aarch64-linux-gnu-gcc; fi
          if [ "$GOOS/$GOARCH" = "linux/amd64" ]; then export CC=x86_64-linux-gnu-gcc; fi
          go build -buildmode=c-shared -o workbuddy-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }} .
          rm -f workbuddy-${{ matrix.goos }}-${{ matrix.goarch }}.h
      - uses: actions/upload-artifact@v4
        with:
          name: workbuddy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: workbuddy-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }}

  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-13
            goarch: amd64
          - runner: macos-14
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Build plugin
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go build -buildmode=c-shared -o workbuddy-darwin-${{ matrix.goarch }}.dylib .
          rm -f workbuddy-darwin-${{ matrix.goarch }}.h
      - uses: actions/upload-artifact@v4
        with:
          name: workbuddy-darwin-${{ matrix.goarch }}
          path: workbuddy-darwin-${{ matrix.goarch }}.dylib

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
